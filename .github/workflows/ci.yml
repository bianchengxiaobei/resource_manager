name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-debug, windows-release, windows-asan]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - name: Go vet and test
        working-directory: server
        run: |
          go vet ./...
          go test ./...
          go test -race ./...
          go build ./...
      - name: Vue build
        working-directory: server/web
        run: |
          npm ci
          npm run generate:api
          npm run build


